# Direct Codex sessions intentionally inherit the user-level model, effort,
# approval, and sandbox defaults used by the Discord bridge. Dispatcher calls
# override model, effort, approval, and sandbox explicitly for deterministic runs.

[features]
# This host blocks bubblewrap user-namespace setup. Codex 0.149.0's deprecated
# Landlock compatibility backend preserves the selected sandbox policy for now.
use_legacy_landlock = true

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"
